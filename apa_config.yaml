site:
  base_url: "https://league.poolplayers.com"
  login_path: "/login"
  # Placeholders -- update these after inspecting your local league portal's
  # actual URLs (view source / devtools network tab while browsing logged in).
  standings_path: "/standings"
  team_path_template: "/teams/{team_id}"
  player_path_template: "/players/{player_id}"

league:
  league_id: "CHANGE_ME"
  division_id: "CHANGE_ME"
  season: "2026 Summer"

team:
  team_id: "13082948"
  team_name: "Team 13082948"

apa:
  # Set APA_ACCESS_TOKEN in the environment; do not put a token here.
  league_id: 1438
  division_id: 436670

database:
  path: "data/apa_tracker.db"

session:
  cache_path: ".session_cache/cookies.pkl"
  timeout_seconds: 15
  max_retries: 3

scheduler:
  daily_sync_hour: 6
  weekly_refresh_day: "Sunday"
  weekly_refresh_hour: 5

export:
  # Renamed from "apa_stats.xlsx" -- a never-before-used filename so any
  # prior copy Excel might have cached (Trusted Documents, MRU, Protected
  # View state) under the old name/path is guaranteed irrelevant to this
  # one. Does not itself change workbook content, table/validation/
  # autofilter logic, or analytics -- see ui/export_excel.py and
  # tests/test_export_excel.py::TestGeneratedFileOpensWithoutRepair for
  # the real, byte-level fix and its regression coverage.
  excel_output_path: "exports/apa_stats_fresh.xlsx"
  json_output_path: "exports/apa_data.json"

logging:
  level: "INFO"
  file: "logs/apa_tracker.log"
