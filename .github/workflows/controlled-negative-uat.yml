name: Controlled negative UAT evidence

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  controlled-negative-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify current release gate state
        run: python tests/verify_release_gate_current_state.py

      - name: Verify VBA init authority
        run: python tests/verify_vba_init_authority.py

      - name: Verify runtime readiness contracts
        run: python -m unittest tests.test_runtime_readiness_contracts -v

      - name: Verify acceptance preparation contracts
        run: python -m unittest tests.test_acceptance_preparation_contracts -v

      - name: Package NC-001 through NC-004 evidence
        run: |
          rm -rf ci_evidence/controlled_negative_packaged
          python scripts/package_controlled_negative_evidence.py \
            --output-dir ci_evidence/controlled_negative_packaged \
            --pr 185

      - name: Publish controlled negative evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: controlled-negative-uat-${{ github.event.pull_request.head.sha || github.sha }}
          path: ci_evidence/controlled_negative_packaged
          if-no-files-found: error
          retention-days: 30
