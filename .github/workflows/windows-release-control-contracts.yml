name: Windows Release Control Contracts

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: windows-release-control-contracts-invest-excel
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  release-control-contracts:
    name: Validate PR 200 release controls without Excel or scheduler mutation
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.number == 200 &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'builder/post-promotion-stock-control-repair-20260823') ||
      (github.event_name != 'pull_request' &&
       github.ref_name == 'builder/post-promotion-stock-control-repair-20260823')
    runs-on: [self-hosted, Windows, X64, invest-excel, excel, vba, com]
    timeout-minutes: 15
    steps:
      - name: Check out exact PR 200 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          clean: true
          persist-credentials: false
      - name: Prove exact clean checkout
        shell: powershell
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($actual -ne $env:EXPECTED_SHA.ToLowerInvariant()) { throw "Checkout drift: expected $env:EXPECTED_SHA got $actual" }
          $status = git status --porcelain
          if ($status) { throw "Checkout is dirty:`n$status" }
          Write-Host "RELEASE_CONTROL_HEAD=$actual"
      - name: Resolve resident Python 3.14 without environment mutation
        shell: powershell
        run: |
          $candidates = New-Object System.Collections.Generic.List[string]
          $py = Get-Command py.exe -ErrorAction SilentlyContinue
          if ($py) { try { $p = (& $py.Source -3.14 -c "import sys; print(sys.executable)").Trim(); if ($LASTEXITCODE -eq 0 -and $p) { [void]$candidates.Add($p) } } catch {} }
          $local = Join-Path $env:LOCALAPPDATA "Programs\Python\Python314\python.exe"
          if (Test-Path -LiteralPath $local -PathType Leaf) { [void]$candidates.Add($local) }
          $resolved = $null
          foreach ($candidate in @($candidates | Select-Object -Unique)) { try { $minor = (& $candidate -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')").Trim(); if ($LASTEXITCODE -eq 0 -and $minor -eq '3.14') { $resolved = $candidate; break } } catch {} }
          if (-not $resolved) { throw "Resident Python 3.14 not found" }
          & $resolved -c "import openpyxl"
          if ($LASTEXITCODE -ne 0) { throw "Required resident dependencies missing" }
          "RUNNER_PYTHON=$resolved" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Compile new release-control Python surfaces
        shell: powershell
        run: |
          & $env:RUNNER_PYTHON -m py_compile scripts/run_unittest_stable.py scripts/post_promotion_acceptance.py tests/test_unittest_stable_runner_contract.py tests/test_post_promotion_acceptance_contract.py tests/test_post_promotion_entrypoint_acceptance_contract.py tests/test_final_unattended_entrypoint_acceptance_contract.py tests/test_release_gate_pr200_contract.py tests/test_xlsm_graph_lifecycle.py tests/test_xlsm_control_preserver_import_boundary.py tests/verify_release_gate_current_state.py
          if ($LASTEXITCODE -ne 0) { throw "Release-control Python compile failed" }
      - name: Parse Windows release PowerShell gates
        shell: powershell
        run: |
          foreach ($file in @("scripts/unattended_acceptance.ps1","scripts/post_promotion_entrypoint_acceptance.ps1","scripts/final_unattended_entrypoint_acceptance.ps1","scripts/install_crypto_tracker_task.ps1","scripts/freeze_daily_market_manager_admin.ps1")) {
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path -LiteralPath $file),[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "PowerShell parse failed: $file" }
          }
      - name: Verify active PR 200 release gate truth
        shell: powershell
        run: |
          & $env:RUNNER_PYTHON tests/verify_release_gate_current_state.py
          if ($LASTEXITCODE -ne 0) { throw "Release gate truth verification failed" }
      - name: Run focused release-control regressions
        shell: powershell
        run: >-
          & $env:RUNNER_PYTHON scripts/run_unittest_stable.py
          tests.test_unittest_stable_runner_contract
          tests.test_release_gate_pr200_contract
          tests.test_post_promotion_acceptance_contract
          tests.test_post_promotion_entrypoint_acceptance_contract
          tests.test_final_unattended_entrypoint_acceptance_contract
          tests.test_xlsm_graph_lifecycle
          tests.test_xlsm_control_preserver_import_boundary
          -v
      - name: Prove workflow remains production free
        shell: powershell
        run: |
          $workflow = Get-Content -LiteralPath ".github/workflows/windows-release-control-contracts.yml" -Raw
          $guardMarker = "      - name: Prove workflow remains production free"
          $guardIndex = $workflow.IndexOf($guardMarker)
          if ($guardIndex -lt 0) { throw "Production-free guard marker is missing" }
          $runtimeSurface = $workflow.Substring(0, $guardIndex)
          foreach ($forbidden in @("Enable-ScheduledTask","Disable-ScheduledTask -TaskName","Start-ScheduledTask","Register-ScheduledTask","Unregister-ScheduledTask","Workbooks.Open","Crypto_Analysis.xlsm")) {
            if ($runtimeSurface.Contains($forbidden)) { throw "Release-control workflow contains forbidden runtime operation before guard: $forbidden" }
          }
          Write-Host "RELEASE_CONTROL_PRODUCTION_FREE: PASS"
      - name: Release-control green gate
        shell: powershell
        run: |
          Write-Host "WINDOWS_RELEASE_CONTROL_CONTRACTS: PASS"
          Write-Host "EXCEL_OPENED: NO"
          Write-Host "SCHEDULER_MUTATED: NO"
          Write-Host "PRODUCTION_MODIFIED: NO"
          Write-Host "PROMOTION_AUTHORIZED: NO"
          Write-Host "PRODUCTION_READY: NO"
