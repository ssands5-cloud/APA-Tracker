name: Daily APA standings sync

# Runs scheduler.daily_sync every day so standings/roster/match-result
# history accumulates in data/apa_tracker.db before the tracker is otherwise
# "ready" -- see apa_config.yaml's scheduler.daily_sync_hour (6 UTC).
#
# Requires, before this will actually collect data:
#   1. Repo secrets APA_USERNAME / APA_PASSWORD (the league portal login).
#   2. apa_config.yaml's league.league_id, league.division_id, and
#      team.team_id / team.team_name filled in with real values -- they
#      ship as "CHANGE_ME" placeholders.
#   3. parser/apa_page_map.py's selectors matching the real portal markup.
# Without all three this job will fail at login/scrape rather than
# silently doing nothing -- check the run logs if it goes red.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: "1"

jobs:
  daily-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run daily sync
        env:
          APA_USERNAME: ${{ secrets.APA_USERNAME }}
          APA_PASSWORD: ${{ secrets.APA_PASSWORD }}
        run: python -m scheduler.daily_sync

      - name: Commit updated standings history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/apa_tracker.db
          if git diff --cached --quiet; then
            echo "No standings changes to commit."
          else
            git commit -m "chore(data): daily standings sync $(date -u +%Y-%m-%d)"
            git push origin HEAD:${{ github.ref_name }}
          fi
